# SPDX-License-Identifier: Apache-2.0
{{- $callerKeys := index .Values "llm-api-gateway" "llmApiGateway" "auth" "callerKeys" }}
{{- $keys := list }}
{{- range .Values.apiKeys }}
{{- $keys = append $keys (dict "id" (.id | toString) "sha256" (.sha256 | toString | lower)) }}
{{- end }}
# Gateway caller key file: key ids and the SHA-256 of each key. The gateway
# re-reads it every 30 seconds.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $callerKeys.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-gateway-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-keys
type: Opaque
data:
  {{ $callerKeys.secretKey }}: {{ toYaml (dict "keys" $keys) | b64enc }}
{{- end }}
